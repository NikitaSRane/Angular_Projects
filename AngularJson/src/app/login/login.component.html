
<div class="container">
    <div class="row">
        <div class="col-md-6">
            <div class="card">
                <div class="text-center">
                    <h1>Marvellous Restaurent Login Portal</h1>
                    <h5>You can login here!</h5>
                </div>
                <form [formGroup]="loginForm" (ngSubmit)="logIn()"> 
                    <div class="mb-3">
                      <label class="form-label">Email address</label>
                      <input [class.is-invalid] = "loginForm.get('email')?.invalid" formControlName="email" type="email" class="form-control" id="exampleInputEmail1" placeholder="Email address">
                      <small [class.d-none]="loginForm.get('email')?.valid" class="text-danger">Email id should be like abc&#64;x.yz</small>
                    </div>
                    <div class="mb-3">
                      <label class="form-label">Password</label>
                      <input  [class.is-invalid] = "loginForm.get('password')?.invalid" formControlName="password"  type="password" class="form-control" id="exampleInputPassword1">
                      <small [class.d-none]="loginForm.get('password')?.valid" class="text-danger">Password should be 6 to 10 digits</small>
                    </div>
                    <button type="submit" class="btn btn-primary">Login</button>
                  </form>
                  <a style="color: blue; margin-top: 10px;" routerLink="/signup">New User? Click to Sign up</a>

            </div>
        </div>
    </div>
</div>
